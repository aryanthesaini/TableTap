# Local development stack: PostgreSQL + Spring Boot API + Next.js web app.
#   docker compose up --build
# Web: http://localhost:3000   API docs: http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tabletap
      POSTGRES_USER: tabletap
      POSTGRES_PASSWORD: tabletap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabletap -d tabletap"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tabletap
      DB_USERNAME: tabletap
      DB_PASSWORD: tabletap
      SPRING_PROFILES_ACTIVE: demo
      # Public URL guests reach the web app on — encoded into every table QR code.
      # Use your LAN IP (e.g. http://192.168.1.20:3000) to scan QR codes from a phone.
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-please-at-least-32-bytes-long}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
