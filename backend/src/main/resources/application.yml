spring:
  application:
    name: tabletap
  profiles:
    default: demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tabletap}}
    username: ${DB_USERNAME:tabletap}
    password: ${DB_PASSWORD:tabletap}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: framework

app:
  # Public URL of the customer-facing web app. QR codes encode {publicBaseUrl}/r/{slug}/t/{token}.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  security:
    jwt-secret: ${JWT_SECRET:change-me-this-is-a-local-development-secret-of-64-bytes-minimum!!}
    jwt-ttl: ${JWT_TTL:PT12H}
  payments:
    provider: ${PAYMENT_PROVIDER:mock}
    pending-timeout: ${PAYMENT_PENDING_TIMEOUT:PT15M}
    # Delay before the mock gateway fires its asynchronous webhook (simulates provider latency).
    mock-webhook-delay: PT2S
  storage:
    provider: local
    local-root: ${STORAGE_LOCAL_ROOT:./data/uploads}
    public-path: /files
  menu-ai:
    provider: mock
    mock-processing-delay: PT3S
  demo:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.platform: INFO
---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
---
spring:
  config:
    activate:
      on-profile: prod
app:
  demo:
    enabled: false
